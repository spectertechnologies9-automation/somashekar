<style>
:root{
  --black:#0B0B0C;
  --panel:#101011;
  --gold:#C9A55C;
  --gold-hi:#E9D29A;
  --gold-lo:#8F7436;
  --ivory:#F2ECDF;
  --text:#CFC8B8;
  --muted:#8E8778;
  --hair:rgba(201,165,92,.22);
  --hair-soft:rgba(242,236,223,.08);
  --wa:#35C46A;

  --pad:24px;
  --ease:cubic-bezier(.19,.8,.22,1);

  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Didot","Bodoni 72","Bodoni MT","Noto Serif Display","Playfair Display","Noto Serif",Georgia,"Times New Roman",serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--black)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--black);color:var(--text);
  font:400 15px/1.55 var(--font-ui);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px}

/* ---------- Card shell ---------- */
.card{
  position:relative;width:100%;max-width:440px;margin:0 auto;min-height:100dvh;
  background:var(--panel);overflow:hidden;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}
@media (min-width:520px){
  body{padding:48px 24px}
  .card{min-height:0;border:1px solid var(--hair);border-radius:3px;box-shadow:0 40px 90px -40px #000}
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  padding:calc(26px + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right)) 22px calc(var(--pad) + env(safe-area-inset-left));
}
/* one slow ambient glow, GPU-only */
.hero::before{
  content:"";position:absolute;top:-140px;right:-150px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(201,165,92,.20),rgba(201,165,92,0));
  animation:drift 16s ease-in-out infinite alternate;pointer-events:none;
}
.hero > *{position:relative}

.hero__top{display:flex;align-items:flex-end;gap:20px}

.arch{position:relative;width:112px;height:144px;flex:none}
.arch::before{
  content:"";position:absolute;inset:-6px;border:1px solid var(--gold);
  border-radius:62px 62px 3px 3px;opacity:.55;
  animation:fade 1.2s .55s ease both;
}
.arch__frame{
  position:absolute;inset:0;overflow:hidden;border-radius:56px 56px 2px 2px;
  background:linear-gradient(160deg,#2A2519 0%,#15140F 70%);
  display:grid;place-items:center;
  animation:wipe 1.1s .1s var(--ease) both;
}
.arch__mono{font:italic 400 38px/1 var(--font-display);color:var(--gold);letter-spacing:.02em}
.arch__img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;
  animation:settle 1.6s var(--ease) both;
}

.meta{padding-bottom:2px;min-width:0}
.meta__role{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.meta__clinic{margin-top:7px;font:400 17px/1.25 var(--font-display);color:var(--ivory)}
.meta__place{margin-top:3px;font-size:12.5px;color:var(--muted)}

.name{margin-top:26px;font-family:var(--font-display);font-weight:400;color:var(--ivory)}
.mask{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.mask > span{display:block;animation:lift .95s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}
.name__pre{font-style:italic;font-size:21px;line-height:1.2;color:var(--gold)}
.name__main{font-size:clamp(38px,12.6vw,52px);line-height:1.08;letter-spacing:-.012em}
@media (min-width:520px){.name__main{font-size:52px}}

.rule{
  height:1px;margin:16px 0 12px;transform-origin:0 50%;
  background:linear-gradient(90deg,var(--gold) 0,var(--gold) 28%,rgba(201,165,92,.12) 100%);
  animation:draw 1.1s .55s var(--ease) both;
}
.tagline{font-size:13.5px;color:var(--muted);letter-spacing:.01em}

/* ---------- Actions ---------- */
.actions{
  display:grid;gap:10px;
  padding:0 calc(var(--pad) + env(safe-area-inset-right)) 0 calc(var(--pad) + env(safe-area-inset-left));
}
.actions__row{display:flex;gap:10px}
.actions__row > *{flex:1 1 0;min-width:0}

.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 16px;overflow:hidden;
  border:1px solid var(--hair);border-radius:3px;background:transparent;color:var(--ivory);
  font:500 14.5px/1 var(--font-ui);letter-spacing:.03em;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:transform .14s ease,border-color .25s ease,background-color .25s ease;
}
.btn svg{width:18px;height:18px;color:var(--gold)}
.btn:active{transform:scale(.975);border-color:var(--gold);background:rgba(201,165,92,.07)}

.btn--primary{
  min-height:58px;border:0;color:#17130A;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;
  background:linear-gradient(100deg,#B8923F 0%,#E6CD8E 48%,#C29E4E 100%);
  box-shadow:0 14px 34px -16px rgba(201,165,92,.7);
}
.btn--primary svg{color:#17130A}
.btn--primary:active{background:linear-gradient(100deg,#B8923F 0%,#E6CD8E 48%,#C29E4E 100%);filter:brightness(.94)}
/* light sweep across the gold bar: once on load, then a long pause */
.btn--primary::after{
  content:"";position:absolute;top:0;bottom:0;left:0;width:38%;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:translateX(-130%) skewX(-18deg);
  animation:sheen 6.5s 1.2s ease-in-out infinite;pointer-events:none;
}
.btn--wa svg{color:var(--wa)}

.links{margin-top:6px}
.link{
  display:flex;align-items:center;gap:14px;min-height:54px;padding:6px 0;
  border-bottom:1px solid var(--hair-soft);
  transition:padding .3s var(--ease),border-color .3s ease;
}
.link svg{width:18px;height:18px;color:var(--gold)}
.link__label{font-size:14.5px;color:var(--ivory);letter-spacing:.02em}
.link__value{flex:1;min-width:0;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link__arrow{width:15px!important;height:15px!important;color:var(--gold-lo)!important;transition:transform .3s var(--ease),color .3s ease}
.link:active{padding-left:6px;border-color:var(--gold)}
.link:active .link__arrow{transform:translateX(4px);color:var(--gold)!important}

@media (hover:hover){
  .btn:hover{border-color:var(--gold);background:rgba(201,165,92,.06)}
  .btn--primary:hover{background:linear-gradient(100deg,#B8923F 0%,#E6CD8E 48%,#C29E4E 100%);filter:brightness(1.06)}
  .link:hover{padding-left:6px;border-color:var(--hair)}
  .link:hover .link__arrow{transform:translateX(4px);color:var(--gold)!important}
  .rows a:hover{color:var(--gold-hi)}
}

.status{min-height:18px;margin-top:10px;text-align:center;font-size:12px;color:var(--muted);opacity:0;transition:opacity .35s ease}
.status.is-on{opacity:1}

/* ---------- Sections ---------- */
.section{
  margin-top:30px;
  padding:0 calc(var(--pad) + env(safe-area-inset-right)) 0 calc(var(--pad) + env(safe-area-inset-left));
}
.section__title{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;
  font:italic 400 20px/1.2 var(--font-display);color:var(--gold);
}
.section__title::after{content:"";flex:1;height:1px;background:var(--hair);transform-origin:0 50%}

.about{font:400 17.5px/1.6 var(--font-display);color:var(--ivory)}

.timeline li{display:grid;grid-template-columns:58px 1fr;gap:6px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hair-soft);font-size:14.5px}
.timeline li:last-child{border-bottom:0}
.timeline b{font:400 17px/1.2 var(--font-display);color:var(--gold);font-variant-numeric:lining-nums}

.practice{font:400 17px/1.75 var(--font-display);color:var(--ivory)}
.practice span{display:inline-block}
.practice i{font-style:normal;color:var(--gold);padding:0 .5em}

.rows{display:grid;gap:16px}
.rows__row{display:grid;grid-template-columns:58px 1fr;gap:6px;font-size:14.5px;line-height:1.55}
.rows__label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rows a{display:block;transition:color .2s ease}
.rows small{font-size:12px;color:var(--muted)}

.foot{margin-top:38px;text-align:center;font:italic 400 14px/1 var(--font-display);color:var(--gold-lo);letter-spacing:.03em}

/* ---------- Motion ---------- */
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lift{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:.55}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes settle{from{transform:scale(1.18)}to{transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-46px,34px,0)}}
@keyframes sheen{0%{transform:translateX(-130%) skewX(-18deg)}20%,100%{transform:translateX(420%) skewX(-18deg)}}

/* Scroll reveals — only armed when JS adds .io (so content is never hidden without it) */
.io .reveal .section__title{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .7s var(--ease)}
.io .reveal .section__title::after{transform:scaleX(0);transition:transform 1s .15s var(--ease)}
.io .reveal .st{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .7s var(--ease);transition-delay:calc(var(--i,0) * 55ms + 140ms)}
.io .reveal.is-in .section__title,.io .reveal.is-in .st{opacity:1;transform:none}
.io .reveal.is-in .section__title::after{transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn--primary::after{display:none}
}

@media (max-width:350px){
  :root{--pad:18px}
  .arch{width:96px;height:124px}
  .arch__frame{border-radius:48px 48px 2px 2px}
  .arch::before{border-radius:54px 54px 3px 3px}
  .btn{font-size:13.5px;padding:0 10px}
}
</style>
</head>

    wa: '<path d="M3.500 20.500l1.300-4.300A8.300 8.300 0 1 1 8 19.300l-4.500 1.200z"/><path d="M9.200 8.700c-.3 2.900 3.200 6.400 6.100 6.100l.9-1.300-1.800-1-.9.800a4.600 4.600 0 0 1-2.200-2.200l.8-.9-1-1.800-1.900.3z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="1.500"/><path d="M3.500 7.500l8.500 6 8.500-6"/>',
    pin: '<path d="M12 21s-6.500-5.600-6.500-11a6.500 6.500 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.400"/>',
    web: '<circle cx="12" cy="12" r="8.500"/><path d="M3.500 12h17M12 3.500c2.300 2.300 3.500 5.200 3.500 8.500s-1.200 6.200-3.500 8.500c-2.300-2.300-3.500-5.200-3.500-8.500S9.700 5.800 12 3.500z"/>',
    arrow: '<path d="M5 12h14M13.500 6.500L19 12l-5.500 5.500"/>'
  };

  function icon(name, cls) {
    return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  var C = CONFIG;
  var a = C.address;
  var n = C.nameParts;
  var addressLine = [a.street, a.locality, a.city + ' ' + a.postalCode, a.state].filter(Boolean).join(', ');
  var primary = C.phones[0];
  var domain = C.website.replace(/^https?:\/\/|\/$/g, '');
  var mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(C.mapsDestination || addressLine);
  var waUrl = C.whatsapp ? 'https://wa.me/' + C.whatsapp.replace(/\D/g, '') + (C.whatsappMessage ? '?text=' + encodeURIComponent(C.whatsappMessage) : '') : '';
  var mailUrl = C.email ? 'mailto:' + C.email : '';

  /* ---------- Hero ---------- */
  $('role').textContent = C.designation + (C.qualifications ? ' · ' + C.qualifications : '');
  $('clinic').textContent = C.clinic;
  $('place').textContent = a.city + (C.established ? ' · Est. ' + C.established : '');
  $('name').setAttribute('aria-label', C.name);
  $('namePre').textContent = n.prefix + ' ' + n.given;
  $('nameMain').textContent = n.family;
  $('tagline').textContent = C.tagline;
  $('mono').textContent = n.family.charAt(0).toUpperCase();

  (function loadPortrait() {
    var sources = [C.profileImage, C.profileImageFallback].filter(Boolean);
    if (!sources.length) return;                       // monogram placeholder stays
    var img = new Image();
    var index = 0;
    img.className = 'arch__img';
    img.alt = 'Portrait of ' + C.name;
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.width = 336; img.height = 431;
    img.onload = function () { $('portrait').appendChild(img); };
    img.onerror = function () { index += 1; if (index < sources.length) img.src = sources[index]; };
    img.src = sources[0];
  })();

  /* ---------- Actions ---------- */
  function attrs(href, aria, external) {
    return ' href="' + esc(href) + '"' + (external ? ' target="_blank" rel="noopener"' : '') + ' aria-label="' + esc(aria) + '"';
  }
  function btn(cls, href, iconName, label, aria, external, d) {
    return '<a class="btn ' + cls + ' rise" style="--d:' + d + '"' + attrs(href, aria, external) + '>' + icon(iconName) + '<span>' + label + '</span></a>';
  }
  function row(href, iconName, label, value, aria, external, d) {
    return '<a class="link rise" style="--d:' + d + '"' + attrs(href, aria, external) + '>' + icon(iconName) +
      '<span class="link__label">' + label + '</span><span class="link__value">' + esc(value) + '</span>' + icon('arrow', 'link__arrow') + '</a>';
  }

  var pair = btn('', 'tel:' + primary.number, 'call', 'Call Now', 'Call ' + C.name + ' on ' + primary.display, false, 880);
  if (waUrl) pair += btn('btn--wa', waUrl, 'wa', 'WhatsApp', 'Message on WhatsApp', true, 950);

  var rows = '';
  if (mailUrl) rows += row(mailUrl, 'mail', 'Email', C.email, 'Email ' + C.email, false, 1030);
  rows += row(mapsUrl, 'pin', 'Directions', a.locality.split(',').pop().trim() + ', ' + a.city, 'Get directions to ' + C.clinic + ' in Google Maps', true, 1100);
  if (C.website) rows += row(C.website, 'web', 'Website', domain, 'Visit the ' + C.clinic + ' website', true, 1170);

  $('actions').innerHTML =
    '<button type="button" class="btn btn--primary rise" style="--d:780" id="saveBtn">' + icon('save') + '<span id="saveLabel">Save Contact</span></button>' +
    '<div class="actions__row">' + pair + '</div>' +
    '<div class="links">' + rows + '</div>';

  /* ---------- Sections (rendered only when there is data) ---------- */
  function section(title, body) {
    return '<section class="section reveal"><h2 class="section__title">' + title + '</h2>' + body + '</section>';
  }
  var html = '';

  if (C.about) html += section('About', '<p class="about st">' + esc(C.about) + '</p>');

  var facts = C.credentials.map(function (r, i) {
    return '<li class="st" style="--i:' + i + '"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></li>';
  });
  if (facts.length) html += section('Background', '<ul class="timeline">' + facts.join('') + '</ul>');

  if (C.specializations.length) {
    html += section('Practice', '<p class="practice">' + C.specializations.map(function (s, i) {
      return '<span class="st" style="--i:' + i + '">' + esc(s) + (i < C.specializations.length - 1 ? '<i aria-hidden="true">/</i>' : '') + '</span>';
    }).join(' ') + '</p>');
  }

  var info = '<div class="rows__row st" style="--i:0"><span class="rows__label">Visit</span>' +
    '<a href="' + esc(mapsUrl) + '" target="_blank" rel="noopener">' + esc(addressLine) + '</a></div>';
  if (C.hours) info += '<div class="rows__row st" style="--i:1"><span class="rows__label">Hours</span><span>' + esc(C.hours) + '</span></div>';
  info += '<div class="rows__row st" style="--i:2"><span class="rows__label">Call</span><div>' +
    C.phones.map(function (p) {
      return '<a href="tel:' + esc(p.number) + '">' + esc(p.display) + ' <small>· ' + esc(p.label) + '</small></a>';
    }).join('') + '</div></div>';
  if (C.languages.length) info += '<div class="rows__row st" style="--i:3"><span class="rows__label">Speaks</span><span>' + esc(C.languages.join(', ')) + '</span></div>';
  html += section('The Clinic', '<div class="rows">' + info + '</div>');

  $('sections').innerHTML = html;
  $('foot').textContent = C.clinic + (C.established ? ' · Since ' + C.established : '');

  /* ---------- Scroll reveals (progressive enhancement) ---------- */
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ('IntersectionObserver' in window && !calm) {
    document.documentElement.classList.add('io');
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { entry.target.classList.add('is-in'); observer.unobserve(entry.target); }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -6% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function (el) { observer.observe(el); });
  }

  /* ---------- vCard (Save Contact) ---------- */
  function vEsc(value) {
    return String(value).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  }
  function buildVCard() {
    var lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + vEsc(n.family) + ';' + vEsc(n.given) + ';;' + vEsc(n.prefix) + ';' + vEsc(C.qualifications || ''),
      'FN:' + vEsc(C.name),
      'ORG:' + vEsc(C.clinic),
      'TITLE:' + vEsc(C.designation)
    ];
    C.phones.forEach(function (p, i) {
      var type = /clinic|work|land/i.test(p.label) ? 'WORK,VOICE' : 'CELL,VOICE';
      lines.push('TEL;TYPE=' + type + (i === 0 ? ',PREF' : '') + ':' + p.number);
    });
    if (C.email) lines.push('EMAIL;TYPE=INTERNET,WORK:' + C.email);
    lines.push('ADR;TYPE=WORK:;;' + [a.street + (a.locality ? ', ' + a.locality : ''), a.city, a.state, a.postalCode, a.country].map(vEsc).join(';'));
    if (C.website) lines.push('URL:' + C.website);
    if (C.hours) lines.push('NOTE:' + vEsc('Clinic hours: ' + C.hours));
    lines.push('END:VCARD');
    return lines.join('\r\n') + '\r\n';
  }

  var resetTimer;
  $('saveBtn').addEventListener('click', function () {
    var vcard = buildVCard();
    var link = document.createElement('a');
    var url;
    try {
      url = URL.createObjectURL(new Blob([vcard], { type: 'text/vcard;charset=utf-8' }));
    } catch (err) {
      url = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);
    }
    link.href = url;
    link.download = C.vcardFilename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    if (url.indexOf('blob:') === 0) setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

    var button = this;
    var status = $('status');
    button.querySelector('svg').innerHTML = ICON.check;
    $('saveLabel').textContent = 'Contact Ready';
    status.textContent = 'Open the downloaded card to add it to your contacts.';
    status.classList.add('is-on');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      button.querySelector('svg').innerHTML = ICON.save;
      $('saveLabel').textContent = 'Save Contact';
      status.classList.remove('is-on');
    }, 4500);
  });
})();
</script>
</body>
</html>
